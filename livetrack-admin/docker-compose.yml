services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: livetrack
      POSTGRES_PASSWORD: livetrack
      POSTGRES_DB: livetrack
    volumes: [livetrack_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U livetrack"], interval: 5s, timeout: 5s, retries: 10 }
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://livetrack:livetrack@postgres:5432/livetrack?schema=public
      JWT_ACCESS_SECRET: docker-access-secret-replace-in-production-123
      JWT_REFRESH_SECRET: docker-refresh-secret-replace-production-123
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:8080
      PORT: 4000
      NODE_ENV: production
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["4000:4000"]
    healthcheck: { test: ["CMD","wget","-q","-O-","http://localhost:4000/health"], interval: 10s, timeout: 5s, retries: 5 }
  dashboard:
    build: ./dashboard
    ports: ["8080:80"]
    depends_on: { backend: { condition: service_healthy } }
volumes: { livetrack_data: {} }
