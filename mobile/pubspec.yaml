name: livetrack_mobile
description: Consent-based live location sharing mobile app for Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  battery_plus: ^6.0.3
  connectivity_plus: ^6.0.5
  dio: ^5.5.0+1
  flutter_local_notifications: ^17.2.2
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  geolocator: ^12.0.0
  go_router: ^14.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  uuid: ^4.4.2
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/auth-world-map.png
